<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Support Temporarily Unavailable</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #eafff1, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(16, 185, 129, 0.25);
      border: 1px solid #d1fae5;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 15px;
      color: #065f46;
    }

    p {
      font-size: 1rem;
      color: #065f46;
      opacity: 0.85;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    button {
      background: #10b981;
      border: none;
      color: white;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    button:hover {
      background: #059669;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.45);
    }

    .footer {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #047857;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Support Temporarily Unavailable</h1>
    <p>
      Our support ticket system is currently offline.<br />
      Please join our Discord server to create a ticket.
    </p>

    <button id="discordBtn">Join our Discord</button>

    <div class="footer">
      We’ll help you there 💚
    </div>
  </div>

  <script>
    document.getElementById("discordBtn").addEventListener("click", () => {
      window.open("https://discord.gg/Qa6qXDeHtt", "_blank");
    });
  </script>
</body>
</html>
